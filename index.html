<script>
  // ---------------------------------------------------------------
  // Raytheon (RTX) Missiles & Defense HQ — 1151 E Hermans Rd, Tucson
  // ---------------------------------------------------------------
  var RTX = [32.1051, -110.9456];

  var map = L.map('map').setView([32.13, -110.90], 10);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // ---- Raytheon marker (red star) ----
  var rtxIcon = L.divIcon({ className: 'rtx-icon', html: '&#9733;', iconSize: [26,26], iconAnchor: [13,13] });
  L.marker(RTX, { icon: rtxIcon, zIndexOffset: 1000 })
    .addTo(map)
    .bindTooltip('Raytheon / RTX — Airport Campus', { permanent: true, direction: 'right', offset: [12,0], className: 'hood-label' })
    .bindPopup('<b class="hood">Raytheon (RTX Missiles &amp; Defense)</b><br>' +
               '1151 E Hermans Rd — main Tucson campus on the south side of Tucson International Airport. ' +
               'All commute rings on this map are centered here.');

  // ---- Measured rush-hour drive times (minutes; flexible window: arrive 8-9a, leave 5-6p) ----
  // null until the measurement pass is embedded; when set, overrides judgment commute scores
  // and replaces the distance rings.
  // Measured 2026-07-26 via Google Maps depart-at, Mon Jul 27 predicted traffic.
  // Flex schedule: best of depart 8:00/8:30a inbound, best of 5:00/5:45p outbound; worse direction shown.
  var RUSH = {
    'Downtown / 4th Ave': 28,
    'Armory Park': 28,
    'Barrio Viejo': 24,
    'University / West University': 31,
    'Sam Hughes': 31,
    'Menlo Park / Mercado': 24,
    'Midtown (Speedway/Broadway core)': 35,
    'East side (Broadway/Wilmot–Kolb)': 38,
    'Rita Ranch': 36,
    'Civano': 36,
    'Vail': 33,
    'Sahuarita': 21,
    'Green Valley': 31,
    'South Tucson (city)': 22,
    'Catalina Foothills': 43,
    'Oro Valley': 50
  };
  function minutesToScore(m) {
    return m <= 15 ? 5 : m <= 22 ? 4 : m <= 30 ? 3 : m <= 40 ? 2 : m <= 50 ? 1 : 0.5;
  }

  // ---- Commute rings (radius approximations of drive time; hidden once RUSH is measured) ----
  var MI = 1609.34;
  (RUSH ? [] :
  [{ r: 8,  label: '~15 min drive (≈8 mi)' },
   { r: 14, label: '~25 min drive (≈14 mi)' },
   { r: 20, label: '~35 min drive (≈20 mi)' }]).forEach(function (ring) {
    L.circle(RTX, {
      radius: ring.r * MI,
      color: '#8a6d1f', weight: 1.5, dashArray: '6 6',
      fill: true, fillColor: '#c9a227', fillOpacity: 0.03
    }).addTo(map);
    var labelLat = RTX[0] + ring.r / 69.05;
    L.marker([labelLat, RTX[1]], {
      icon: L.divIcon({ className: 'ring-label', html: ring.label, iconSize: [150, 14], iconAnchor: [75, 7] }),
      interactive: false
    }).addTo(map);
  });

  // ---- Fit categories (tier order: gray < orange < blue < green) ----
  var TIERS = ['gray', 'orange', 'blue', 'green'];
  var FIT = {
    green:  { color: '#1e8a3c', name: 'Strong candidate' },
    blue:   { color: '#2563c9', name: 'Potential / depends on preferences' },
    orange: { color: '#e07b00', name: 'Marginal' },
    gray:   { color: '#7a7a7a', name: 'Likely ruled out' }
  };

  // ---- Lifestyle dimensions (all scores 0-5), grouped for the panel ----
  var DIMS = [
    // SCENE
    { key: 'jazz',    grp: 'scene',     label: 'Live jazz (Century Room / Jazz Fest)' },
    { key: 'music',   grp: 'scene',     label: 'Live music venues (Rialto, Fox, 191 Toole)' },
    { key: 'night',   grp: 'scene',     label: 'Bar/club nightlife (4th Ave / University)' },
    { key: 'rest',    grp: 'scene',     label: 'Restaurants & coffee' },
    { key: 'ypro',    grp: 'scene',     label: 'Young-professional crowd' },
    { key: 'hist',    grp: 'scene',     label: 'Historic character' },
    { key: 'walk',    grp: 'scene',     label: 'Walkable streets' },
    { key: 'quiet',   grp: 'scene',     label: 'Quiet residential' },
    // ACTIVE
    { key: 'climb',   grp: 'active',    label: 'Rock climbing (Rocks & Ropes, BLOC, Lemmon)' },
    { key: 'hike',    grp: 'active',    label: 'Hiking access' },
    { key: 'bike',    grp: 'active',    label: 'Road/mountain biking' },
    { key: 'gym',     grp: 'active',    label: 'Gym access' },
    { key: 'pool',    grp: 'active',    label: 'Community pool access' },
    // PRACTICAL
    { key: 'groc',    grp: 'practical', label: 'Grocery convenience' },
    { key: 'newc',    grp: 'practical', label: 'New construction' },
    { key: 'safe',    grp: 'practical', label: 'Safety priority' },
    { key: 'cat',     grp: 'practical', label: 'Cat-friendly rental stock' },
    { key: 'transit', grp: 'practical', label: 'Public transit / Sun Link streetcar' }
  ];
  var GROUPS = [
    { id: 'scene',     title: 'Scene' },
    { id: 'active',    title: 'Active' },
    { id: 'practical', title: 'Practical' }
  ];
  // Son's preset: jazz+music ON, nightlife OFF, climb/hike/ypro/rest/gym ON, all others OFF.
  var SON_PRESET = { jazz: true, music: true, climb: true, hike: true, ypro: true, rest: true, gym: true };
  var PRESET_RENT = 1850, PRESET_CW = 35;

  // ---- Neighborhoods ----
  // fit = preliminary baseline; s = 18 dimension scores 0-5; cm = commute score 0-5
  // (judgment-based pending measured rush-hour times); rentMid = typical 1BR midpoint ($).
  var hoods = [
    {
      name: 'Downtown / 4th Ave', ll: [32.2225, -110.9680], rad: 1400, fit: 'green', cm: 4, rentMid: 1400,
      s: { jazz:5, music:5, night:5, rest:5, ypro:5, hist:4, walk:5, quiet:1.5,
           climb:5, hike:3, bike:3.5, gym:4, pool:2.5,
           groc:2.5, newc:4, safe:2.5, cat:2.5, transit:5 },
      txt: 'The center of Tucson nightlife and its live-music row: Rialto Theatre, Fox Theatre, 191 Toole, Club Congress — and the Century Room jazz club inside Hotel Congress (the Tucson Jazz Festival runs downtown every January). Rocks &amp; Ropes climbing gym is on S Toole Ave; the Sun Link streetcar runs through. 1BR runs roughly ~$1,100&ndash;1,700. Reverse commute straight south on I-10/Benson Hwy, about 15&ndash;20 min.'
    },
    {
      name: 'Armory Park', ll: [32.2145, -110.9660], rad: 900, fit: 'green', cm: 4, rentMid: 1250,
      s: { jazz:5, music:5, night:4, rest:4.5, ypro:4.5, hist:5, walk:5, quiet:3,
           climb:4.5, hike:3, bike:3.5, gym:4, pool:2.5,
           groc:2.5, newc:2, safe:3, cat:4.5, transit:4 },
      txt: 'Historic, walkable district on the south edge of downtown — adobe row houses and Victorians, ranked among Tucson’s best areas for young professionals. Ten-minute walk to the Century Room jazz club and the downtown venue row; lots of casita/private-landlord rentals. 1BR roughly ~$1,100&ndash;1,400. One of the shortest quality-of-life commutes on the map: ~15 min south to the plant.'
    },
    {
      name: 'Barrio Viejo', ll: [32.2120, -110.9720], rad: 700, fit: 'blue', cm: 4, rentMid: 1500,
      s: { jazz:4, music:4, night:4, rest:4, ypro:4, hist:5, walk:4.5, quiet:3.5,
           climb:4, hike:3, bike:3.5, gym:3.5, pool:2,
           groc:2.5, newc:1.5, safe:3, cat:4.5, transit:3.5 },
      txt: 'Tucson’s most photogenic neighborhood — colorful 19th-century adobes just south of downtown, an easy walk/bike to the Century Room and the venue row. Very small rental inventory; expect ~$1,200&ndash;1,800 when something appears. Same easy ~15 min commute as Armory Park; blue only because supply is thin.'
    },
    {
      name: 'University / West University', ll: [32.2330, -110.9590], rad: 1000, fit: 'blue', cm: 3.5, rentMid: 1100,
      s: { jazz:3, music:4, night:5, rest:3.5, ypro:2.5, hist:4, walk:4.5, quiet:1.5,
           climb:4, hike:2.5, bike:4, gym:4.5, pool:4,
           groc:3, newc:4.5, safe:2.5, cat:2, transit:5 },
      txt: 'Directly around the UA campus: cheap and lively, the epicenter of the bar/club scene, with the streetcar through the middle — but dominated by undergrads and purpose-built student housing. 1BR roughly ~$900&ndash;1,300. Fine commute (~20 min), but a young professional may feel done with the student scene — depends on preference.'
    },
    {
      name: 'Sam Hughes', ll: [32.2290, -110.9300], rad: 1200, fit: 'green', cm: 3.5, rentMid: 1200,
      s: { jazz:2.5, music:3, night:3, rest:3.5, ypro:4, hist:4.5, walk:4, quiet:4,
           climb:3.5, hike:3, bike:4, gym:4, pool:3,
           groc:4, newc:1.5, safe:3.5, cat:4.5, transit:3 },
      txt: 'Leafy historic neighborhood east of UA — bungalows, casitas, and small complexes; consistently rated a top spot for young professionals who want quiet-but-close, and a casita market that private landlords (read: cat-friendly) dominate. 1BR roughly ~$1,000&ndash;1,400. About 20 min to Raytheon via Campbell/Kino Pkwy south; ~10 min drive to the downtown venues.'
    },
    {
      name: 'Menlo Park / Mercado', ll: [32.2220, -110.9850], rad: 1000, fit: 'blue', cm: 3.5, rentMid: 1100,
      s: { jazz:3, music:3, night:2.5, rest:4, ypro:3.5, hist:4, walk:3.5, quiet:3.5,

           groc:2.5, newc:3, safe:3, cat:4, transit:4.5 },
      txt: 'Up-and-coming west-of-I-10 neighborhood anchored by the Mercado San Agustin district — the Sun Link streetcar’s western terminus — with Tumamoc Hill, Sentinel Peak, and The Loop river path out the back door. 1BR roughly ~$900&ndash;1,300. Commute ~18&ndash;20 min. Blue: improving fast but still patchy block-to-block.'
    },
    {
      name: 'Midtown (Speedway/Broadway core)', ll: [32.2330, -110.9020], rad: 2200, fit: 'green', cm: 3.5, rentMid: 950,
      s: { jazz:2, music:2.5, night:2, rest:3.5, ypro:3, hist:2, walk:2.5, quiet:3,
           climb:3.5, hike:2.5, bike:3.5, gym:4, pool:3.5,
           groc:4.5, newc:2, safe:2.5, cat:3.5, transit:2.5 },
      txt: 'Tucson’s big affordable middle — garden apartments and small complexes along the Speedway/Broadway corridors, with the metro’s best grocery/errand convenience. Bus-only transit. 1BR roughly ~$800&ndash;1,100, the best value on the map. 20&ndash;25 min to Raytheon via Alvernon or Kino south.'
    },
    {
      name: 'East side (Broadway/Wilmot–Kolb)', ll: [32.2210, -110.8480], rad: 2500, fit: 'blue', cm: 3.5, rentMid: 1025,
      s: { jazz:1, music:1.5, night:1.5, rest:3, ypro:2.5, hist:1, walk:2, quiet:3.5,
           climb:3.5, hike:3.5, bike:4, gym:4, pool:4,
           groc:4.5, newc:2.5, safe:3, cat:3, transit:2 },
      txt: 'Suburban-style apartment corridors with plenty of inventory and decent prices (1BR ~$850&ndash;1,200). The BLOC climbing gym (Tanque Verde Rd) and the Catalina Hwy up Mount Lemmon are closest from here. Commute is a reasonable 20&ndash;25 min down Kolb/Golf Links. Solid practical option, modest on walkable lifestyle.'
    },
    {
      name: 'Rita Ranch', ll: [32.1350, -110.7770], rad: 2500, fit: 'green', cm: 4.5, rentMid: 1550,
      s: { jazz:0.5, music:1, night:1, rest:2, ypro:3, hist:0.5, walk:2, quiet:4.5,
           climb:2, hike:3.5, bike:4, gym:3.5, pool:4.5,
           groc:3.5, newc:5, safe:4.5, cat:3, transit:1 },
      txt: 'Newer master-planned area on the far southeast side — heavily populated by Raytheon and Davis-Monthan people for a reason: ~15 min straight up Valencia/Rita Rd to the plant, and the Fantasy Island mountain-bike trail network is next door. Newer complexes run ~$1,300&ndash;1,800 for a 1BR. Quiet and suburban; live music or jazz means a 25&ndash;30 min drive downtown.'
    },
    {
      name: 'Civano', ll: [32.1640, -110.7740], rad: 1300, fit: 'blue', cm: 4, rentMid: 1900,
      s: { jazz:0.5, music:1, night:0.5, rest:2, ypro:2, hist:1.5, walk:3.5, quiet:4.5,
           climb:2, hike:4, bike:4.5, gym:3, pool:4.5,
           groc:3, newc:4, safe:4.5, cat:3.5, transit:0.5 },
      txt: 'A distinctive New-Urbanist/sustainable community off Houghton — charming walkable core, community pool, and the Saguaro East/Fantasy Island trail systems nearby, but mostly owner-occupied homes; rentals are scarce and often houses (~$1,600&ndash;2,200). ~20 min commute. Blue: great if a rental appears, but limited stock and a family-oriented feel.'
    },
    {
      name: 'Vail', ll: [32.0480, -110.7120], rad: 3200, fit: 'blue', cm: 3.5, rentMid: 1850,
      s: { jazz:0, music:0.5, night:0.5, rest:1.5, ypro:1.5, hist:1, walk:1, quiet:5,
           climb:2, hike:4, bike:3.5, gym:2.5, pool:3.5,
           groc:2.5, newc:5, safe:5, cat:3.5, transit:0.5 },
      txt: 'Fast-growing suburb southeast of Rita Ranch, top-rated schools, almost entirely single-family homes — house rentals ~$1,600&ndash;2,100, very few apartments. Good Rincon-foothills hiking (Colossal Cave, Cienega Creek). Commute ~25 min via I-10/Rita Rd. Blue: fine commute, but a family suburb with little for a single young professional.'
    },
    {
      name: 'Sahuarita', ll: [31.9575, -110.9560], rad: 3200, fit: 'blue', cm: 4, rentMid: 1500,
      s: { jazz:0.5, music:1, night:1, rest:2, ypro:2, hist:0.5, walk:2, quiet:4.5,
           climb:1.5, hike:3, bike:3, gym:3, pool:4.5,
           groc:4, newc:5, safe:5, cat:3, transit:0.5 },
      txt: 'Newer planned community ~15&ndash;20 min straight down I-19 — one of the easiest commutes on the map. Clean and safe with lake-park amenities and Madera Canyon hiking a half hour south; 1BR/small rentals roughly ~$1,300&ndash;1,700 but mostly houses and a strongly family-oriented vibe. Blue: commute great, social scene thin.'
    },
    {
      name: 'Green Valley', ll: [31.8540, -110.9940], rad: 3800, fit: 'gray', cm: 2.5, rentMid: 1300,
      s: { jazz:1, music:0.5, night:0.5, rest:2, ypro:0, hist:1, walk:1.5, quiet:5,
           climb:1.5, hike:3.5, bike:3, gym:3, pool:4.5,
           groc:4, newc:3, safe:5, cat:2.5, transit:0.5 },
      txt: 'Largely a 55+ retirement community 25&ndash;30 min south on I-19. Rents are moderate (1BR ~$1,200&ndash;1,400) but the demographic skews decades older — a poor lifestyle match for a young engineer regardless of commute.'
    },
    {
      name: 'South Tucson (city)', ll: [32.1960, -110.9680], rad: 900, fit: 'orange', cm: 5, rentMid: 850,
      s: { jazz:2, music:2.5, night:1.5, rest:4.5, ypro:2, hist:3.5, walk:3, quiet:2,
           climb:3.5, hike:2.5, bike:3.5, gym:3, pool:2,
           groc:3, newc:1, safe:1.5, cat:3.5, transit:3 },
      txt: 'A separate one-square-mile city famous for its Mexican food corridor on S 4th Ave; Hotel McCoy’s music/art events are just across I-10. Very cheap (1BR ~$700&ndash;1,000) and only ~10&ndash;12 min from the plant, but rental quality is inconsistent and crime rates run higher than the metro average. Marginal: cheapest close-in option, look building-by-building.'
    },
    {
      name: 'Catalina Foothills', ll: [32.2980, -110.9180], rad: 3200, fit: 'orange', cm: 1.5, rentMid: 1750,
      s: { jazz:2.5, music:1.5, night:2, rest:4, ypro:2, hist:1.5, walk:1.5, quiet:4.5,
           climb:4, hike:5, bike:4, gym:4, pool:4.5,
           groc:4, newc:3, safe:4.5, cat:2.5, transit:1 },
      txt: 'Upscale desert-view living on the north side — resort-style complexes near La Encantada, the best trailhead access in the metro (Sabino Canyon, Finger Rock), and regular resort jazz/live-music nights (e.g., Hacienda del Sol). 1BR roughly ~$1,400&ndash;2,000+. The catch: 35&ndash;45 min diagonally across the whole city in traffic.'
    },
    {

    }
  ];

  // ---- Scoring model ----
  // No toggles on  -> baseline fit color; ranked list falls back to commute score.
  // Toggles on     -> score = w*commute + (1-w)*avg(checked), w = commute-importance slider.
  //                   Tier cap: max one tier above baseline (safety/supply/demographics persist).
  // Max-rent slider: neighborhoods whose typical-1BR midpoint exceeds it are forced gray.
  var active = {};
  DIMS.forEach(function (d) { active[d.key] = false; });
  var maxRent = PRESET_RENT;      // $
  var commuteW = PRESET_CW / 100; // 0..1

  function activeKeys() {
    return DIMS.map(function (d) { return d.key; }).filter(function (k) { return active[k]; });
  }
  function overBudget(h) { return h.rentMid > maxRent; }
  function combinedScore(h) {
    var keys = activeKeys();
    if (!keys.length) return null;
    var sum = 0;
    keys.forEach(function (k) { sum += h.s[k]; });
    return commuteW * h.cm + (1 - commuteW) * (sum / keys.length);
  }
  function rankScore(h) {
    var sc = combinedScore(h);
    return sc === null ? h.cm : sc;
  }
  function scoreTier(score) {
    if (score >= 3.5) return 3;
    if (score >= 2.6) return 2;
    if (score >= 2.0) return 1;
    return 0;
  }
  function currentTierName(h) {
    if (overBudget(h)) return 'gray';
    var sc = combinedScore(h);
    if (sc === null) return h.fit;
    var dyn = scoreTier(sc);
    var base = TIERS.indexOf(h.fit);
    return TIERS[Math.min(dyn, base + 1)];
  }

  function buildPopup(h) {
    var tier = currentTierName(h);
    var f = FIT[tier];
    var sc = combinedScore(h);
    var html = '<b class="hood">' + h.name + '</b>' +
      '<span class="fit-tag" style="background:' + f.color + '">' + f.name + '</span>';
    if (overBudget(h)) {
      html += '<span class="ob-tag">Over budget</span>';
    }
    html += '<br>' + h.txt;
    if (h.rush != null) {
      html += '<div style="margin-top:5px;font-size:12px;color:#0b5d1e"><b>&#128663; ~' + h.rush +
              ' min at rush hour</b> (measured; flexible window: arrive 8&ndash;9a, leave 5&ndash;6p)</div>';
    }
    html += '<div style="margin-top:5px;font-size:12px">Typical 1BR midpoint: <b>$' + h.rentMid.toLocaleString() + '</b>' +
            (overBudget(h) ? ' — <b>above your $' + maxRent.toLocaleString() + ' max</b>, so it is grayed out.' : '') + '</div>';
    var keys = activeKeys();
    if (keys.length) {
      html += '<table class="scores">';
      DIMS.forEach(function (d) {
        if (!active[d.key]) return;
        html += '<tr><td>&#10003; ' + d.label.split(' (')[0] + '</td><td class="num">' +
                h.s[d.key].toFixed(1) + '/5</td></tr>';
      });
      html += '<tr><td>Commute (weight ' + Math.round(commuteW * 100) + '%)</td><td class="num">' +
              h.cm.toFixed(1) + '/5</td></tr></table>';
      html += '<div style="margin-top:5px;font-size:12px"><b>Combined score: ' + sc.toFixed(2) + '</b></div>';
    }
    html += '<br><span style="color:#888;font-size:11px">Rents: approx. 2025&ndash;26 listing averages ' +
            '(Apartments.com / RentCafe / Zumper / ApartmentList). Preliminary rating.</span>';
    if (typeof listingsData !== 'undefined' && listingsData.length) {
      var nL = hoodListingCount(h);
      html += '<div style="margin-top:6px;padding-top:6px;border-top:1px solid #ddd">' +
        '<b>' + nL + '</b> current listing' + (nL === 1 ? '' : 's') + ' here match his filters ' +
        (nL ? '&mdash; <a href="#" onclick="_showHoodListings(' + hoods.indexOf(h) + ');return false" style="font-weight:600">show them</a>' : '') +
        '</div>';
    }
    return html;
  }

  if (RUSH) hoods.forEach(function (h) {
    if (RUSH[h.name] != null) { h.rush = RUSH[h.name]; h.cm = minutesToScore(h.rush); }
  });

  var circles = [];
  hoods.forEach(function (h) {
    var f = FIT[h.fit];
    var c = L.circle(h.ll, {
      radius: h.rad,
      color: f.color, weight: 2, opacity: 0.9,
      fillColor: f.color, fillOpacity: 0.22
    }).addTo(map);
    c.bindTooltip(h.rush != null ? h.name + ' · ' + h.rush + "'" : h.name,
                  { permanent: true, direction: 'center', className: 'hood-label' });
    c.bindPopup(function () { return buildPopup(h); }, { maxWidth: 340 });
    circles.push({ hood: h, circle: c });
  });

  function updateUI() {
    circles.forEach(function (e) {
      var f = FIT[currentTierName(e.hood)];
      e.circle.setStyle({ color: f.color, fillColor: f.color });
    });
    // ranked list: over-budget entries sink to the bottom
    var ranked = hoods.slice().sort(function (a, b) {
      var oa = overBudget(a) ? 1 : 0, ob = overBudget(b) ? 1 : 0;
      if (oa !== ob) return oa - ob;
      return rankScore(b) - rankScore(a);
    });
    var noneChecked = activeKeys().length === 0;
    var lis = ranked.map(function (h, i) {
      var label = h.name + ' <span class="sc">' + rankScore(h).toFixed(2) + '</span>' +
                  (overBudget(h) ? ' <span class="ob">(over budget)</span>' : '');
      return '<li>' + (i < 3 && !overBudget(h) ? '<b>' + label + '</b>' : label) + '</li>';
    });
    document.getElementById('ranklist').innerHTML = lis.join('');
    document.getElementById('ranknote').textContent = noneChecked ?
      'Nothing checked — ranked by commute score only.' :
      'Ranked by ' + Math.round(commuteW * 100) + '% commute + ' + Math.round(100 - commuteW * 100) + '% checked factors.';
    document.getElementById('rentval').textContent = '$' + maxRent.toLocaleString();
    document.getElementById('cwval').textContent = Math.round(commuteW * 100) + '%';
  }

  // ---- Title (top-left) ----
  var titleCtl = L.control({ position: 'topleft' });
  titleCtl.onAdd = function () {
    var d = L.DomUtil.create('div', 'title-box');
    d.innerHTML = 'Tucson Neighborhood Finder &mdash; Raytheon Airport Campus' +
                  '<div class="sub">Commute rings + preliminary neighborhood fit for a young RTX engineer</div>';
    return d;
  };
  titleCtl.addTo(map);

  // ---- Control panel (top-right) ----
  var toggleCtl = L.control({ position: 'topright' });
  toggleCtl.onAdd = function () {
    var d = L.DomUtil.create('div', 'togglepanel');
    L.DomEvent.disableClickPropagation(d);
    L.DomEvent.disableScrollPropagation(d);
    var html = '<h4>What matters to him? (recolors map)</h4>';
    GROUPS.forEach(function (g) {
      html += '<div class="grouphdr">' + g.title + '</div>';
      DIMS.forEach(function (dim) {
        if (dim.grp !== g.id) return;
        html += '<label class="tgl"><input type="checkbox" id="dim-' + dim.key + '">' + dim.label + '</label>';
      });
    });
    html += '<div class="sliderrow">Max rent (1BR midpoint): <span class="val" id="rentval">$' + PRESET_RENT.toLocaleString() + '</span>' +
            '<input type="range" id="rentslider" min="900" max="2400" step="25" value="' + PRESET_RENT + '"></div>';
    html += '<div class="sliderrow">Commute importance: <span class="val" id="cwval">' + PRESET_CW + '%</span>' +
            '<input type="range" id="cwslider" min="0" max="100" step="5" value="' + PRESET_CW + '"></div>';
    html += '<div class="btnrow">' +
            '<button class="preset" id="btn-son">Son&rsquo;s preset</button>' +
            '<button id="btn-clear">Clear all</button></div>';
    html += '<div class="grouphdr">Ranking (live)</div>' +
            '<div id="ranknote" style="font-size:10.5px;color:#666"></div>' +
            '<ol id="ranklist"></ol>';
    html += '<div class="note">Nothing checked = baseline preliminary colors. Checked = commute-importance% commute + rest checked factors; ' +
            'orange/gray baseline areas can rise at most one tier (safety, rental supply, demographics still apply). ' +
            'Neighborhoods whose typical 1BR midpoint exceeds Max rent are forced gray.</div>';
    d.innerHTML = html;
    return d;
  };
  toggleCtl.addTo(map);

  DIMS.forEach(function (d) {
    document.getElementById('dim-' + d.key).addEventListener('change', function (ev) {
      active[d.key] = ev.target.checked;
      updateUI();
      map.closePopup();
    });
  });
  document.getElementById('rentslider').addEventListener('input', function (ev) {
    maxRent = parseInt(ev.target.value, 10);
    updateUI();
  });
  document.getElementById('cwslider').addEventListener('input', function (ev) {
    commuteW = parseInt(ev.target.value, 10) / 100;
    updateUI();
  });
  document.getElementById('btn-son').addEventListener('click', function () {
    DIMS.forEach(function (d) {
      active[d.key] = !!SON_PRESET[d.key];
      document.getElementById('dim-' + d.key).checked = active[d.key];
    });
    maxRent = PRESET_RENT;
    commuteW = PRESET_CW / 100;
    document.getElementById('rentslider').value = PRESET_RENT;
    document.getElementById('cwslider').value = PRESET_CW;
    updateUI();
    map.closePopup();
  });
  document.getElementById('btn-clear').addEventListener('click', function () {
    DIMS.forEach(function (d) {
      active[d.key] = false;
      document.getElementById('dim-' + d.key).checked = false;
    });
    updateUI();
    map.closePopup();
  });

  // ---- Legend (bottom-right) ----
  var legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    var d = L.DomUtil.create('div', 'legend');
    d.innerHTML =
      '<h4>Fit for a young Raytheon engineer</h4>' +
      '<div><span class="swatch" style="background:' + FIT.green.color  + '"></span>Green &mdash; strong candidate (commute + lifestyle)</div>' +
      '<div><span class="swatch" style="background:' + FIT.blue.color   + '"></span>Blue &mdash; potential, depends on preferences</div>' +
      '<div><span class="swatch" style="background:' + FIT.orange.color + '"></span>Orange &mdash; marginal</div>' +
      '<div><span class="swatch" style="background:' + FIT.gray.color   + '"></span>Gray &mdash; likely ruled out / over budget</div>' +
      '<div class="ringnote">&#9733; = RTX campus (1151 E Hermans Rd).<br>' +
      (RUSH ? 'Neighborhood labels show <b>measured rush-hour minutes</b> to the plant<br>(flexible schedule: arrive 8&ndash;9a, leave 5&ndash;6p; worse direction shown).<br>'
            : 'Dashed rings &asymp; 15 / 25 / 35-min drives (8 / 14 / 20 mi).<br>') +
      'Use the panel (top right) to recolor by his priorities.</div>' +
      '<div class="prelim">Preliminary &mdash; will refine with preferences (budget &amp; lifestyle answers still being collected).</div>';
    return d;
  };
  legend.addTo(map);

  updateUI();

  // ---- Listings layer (listings.json, refreshed by listings_scan.py) ----
  var listingsData = [];
  var listingCluster = null;
  var listingsVisible = true;
  var hiddenIds = {};
  try { hiddenIds = JSON.parse(localStorage.getItem('rejectedListings') || '{}'); } catch (e) {}

  var TYPE_COLOR = { apartment: '#1565c0', house: '#2e7d32', condo: '#7b1fa2' };
  var typeOn = { apartment: true, house: true, condo: true };

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var minBeds = 1, maxBeds = 99, minBaths = 0, maxBaths = 99;
  var zonesOnly = true;   // default: only listings inside neighborhoods currently rating green/blue
  var catsOnly = false;   // true = require explicit cats_ok

  // Assign each listing to the neighborhood circle it falls inside (nearest center wins on overlap)
  function assignHood(l) {
    var best = null, bestRatio = 1e9;
    hoods.forEach(function (h) {
      var d = map.distance([l.lat, l.lng], h.ll);
      if (d <= h.rad && d / h.rad < bestRatio) { bestRatio = d / h.rad; best = h; }
    });
    return best;
  }

  var selectedHood = null;   // set when user clicks "show listings" on a neighborhood popup

  function listingShown(l) {
    if (selectedHood) {
      if (l._hood !== selectedHood) return false;
    } else if (zonesOnly) {
      if (!l._hood) return false;
      var tier = currentTierName(l._hood);
      if (tier !== 'green' && tier !== 'blue') return false;
    }
    var bd = (l.beds == null ? 1 : l.beds), ba = l.baths;
    if (bd < minBeds || bd > maxBeds) return false;
    if (ba != null && (ba < minBaths || ba > maxBaths)) return false;
    if (ba == null && minBaths > 0) return false;
    if (catsOnly && l.cats_ok !== true) return false;
    return listingsVisible && typeOn[l.property_type] !== false &&
           !hiddenIds[l.id] && (!l.price || l.price <= maxRent);
  }

  // Feedback sync — every Pass/Interested action also lands in the Google Sheet
  var FEEDBACK_URL = 'https://script.google.com/macros/s/AKfycbwxVqkzWwIgknWrTB9eOrQwL5g93Tsv_-sisygySGuPRmujiarTGf7nIo9rhptyHGoc/exec';
  function sendFeedback(action, l, extra) {
    try {
      var q = FEEDBACK_URL + '?token=tucson&action=' + action +
        '&id=' + encodeURIComponent(l.id) +
        '&price=' + encodeURIComponent(l.price || '') +
        '&address=' + encodeURIComponent(l.address || '') +
        '&hood=' + encodeURIComponent(l._hood ? l._hood.name : '') +
        '&url=' + encodeURIComponent(l.url || '') + (extra || '');
      new Image().src = q;   // fire-and-forget GET
    } catch (e) { /* offline is fine — localStorage still has it */ }
  }
  function byId(id) { return listingsData.filter(function (l) { return l.id === id; })[0]; }

  var interested = {};
  try { interested = JSON.parse(localStorage.getItem('interestedListings') || '{}'); } catch (e) {}

  function saveInterested() { localStorage.setItem('interestedListings', JSON.stringify(interested)); }

  window._toggleInterest = function (id) {
    var turningOn = !interested[id];
    if (interested[id]) { delete interested[id]; }
    else { interested[id] = { when: new Date().toISOString() }; }
    saveInterested();
    var l = byId(id);
    if (l) sendFeedback('interest', l, '&state=' + (turningOn ? 'on' : 'off'));
    map.closePopup();
    rebuildListings();
  };
  window._removeInterest = function (id) {
    delete interested[id];
    saveInterested();
    rebuildListings();
  };
  window._copyInterest = function () {
    var lines = [];
    listingsData.forEach(function (l) {
      if (!interested[l.id]) return;
      lines.push('$' + l.price + '/mo · ' + l.beds + 'bd/' + (l.baths == null ? '?' : l.baths) + 'ba · ' + l.address +
        (l.contact_name ? ' · ' + l.contact_name : '') +
        (l.contact_phone ? ' · ' + l.contact_phone : '') +
        ' · ' + l.url);
    });
    var txt = lines.join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
      function () { alert('Copied ' + lines.length + ' listings with contact info.'); },
      function () { window.prompt('Copy your interest list:', txt); });
  };

  function renderInterestPanel() {
    var el = document.getElementById('int-body');
    var hd = document.getElementById('int-head');
    if (!el || !hd) return;
    var items = listingsData.filter(function (l) { return interested[l.id]; });
    hd.innerHTML = '&#9829; Interest list (' + items.length + ')';
    if (!items.length) { el.innerHTML = '<div style="color:#888;font-size:11px">Click &#9829; Interested on a listing to add it here.</div>'; return; }
    var h = items.map(function (l) {
      var contact = l.contact_phone
        ? (l.contact_name ? esc(l.contact_name) + ' &middot; ' : '') + '<a href="tel:' + esc(l.contact_phone) + '" style="font-weight:600">' + esc(l.contact_phone) + '</a>'
        : (l.contact_name ? esc(l.contact_name) + ' &middot; ' : '') + '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">contact via listing page</a>';
      return '<div style="border-top:1px solid #eee;padding:4px 0;font-size:11.5px">' +
        '<b>$' + (l.price ? l.price.toLocaleString() : '?') + '</b> &middot; ' + esc(l.beds) + 'bd/' + esc(l.baths == null ? '?' : l.baths) + 'ba &middot; ' +
        '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.address) + '</a><br>' +
        '<span style="color:#444">' + contact + '</span> ' +
        '<a href="#" onclick="_removeInterest(\'' + esc(l.id) + '\');return false" style="color:#c33;float:right">&#10008; remove</a>' +
        '</div>';
    }).join('');
    h += '<button onclick="_copyInterest()" style="margin-top:5px;width:100%;background:#1e8a3c;color:#fff;border:none;border-radius:4px;padding:5px;cursor:pointer;font-weight:600">Copy list (with contacts)</button>';
    el.innerHTML = h;
  }

  window._hideListing = function (id) {
    var reason = window.prompt('Pass on this one — why? (optional; helps tune his preferences)') || '';
    hiddenIds[id] = { when: new Date().toISOString(), reason: reason };
    localStorage.setItem('rejectedListings', JSON.stringify(hiddenIds));
    var l = byId(id);
    if (l) sendFeedback('reject', l, '&reason=' + encodeURIComponent(reason));
    map.closePopup();
    rebuildListings();
  };
  window._resetHidden = function () {
    if (!window.confirm('Un-hide all ' + Object.keys(hiddenIds).length + ' hidden listings?')) return;
    hiddenIds = {};
    localStorage.setItem('rejectedListings', '{}');
    rebuildListings();
  };
  window._copyHidden = function () {
    var txt = JSON.stringify(hiddenIds, null, 1);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
      function () { alert('Copied ' + Object.keys(hiddenIds).length + ' rejections — paste them to Dad/Claude to tune the model.'); },
      function () { window.prompt('Copy this and send it to Dad/Claude:', txt); });
  };

  function listingPopup(l) {
    var h = '<div style="font-size:12.5px;max-width:270px">';
    if (l.thumbnail_url) h += '<img src="' + esc(l.thumbnail_url) + '" style="width:100%;max-height:130px;object-fit:cover;border-radius:4px" onerror="this.style.display=\'none\'">';
    h += '<div style="font-weight:700;font-size:14px;margin-top:4px">$' + (l.price ? l.price.toLocaleString() : '?') + '/mo' +
         ' <span style="font-weight:400;color:#555">&middot; ' + esc(l.beds) + ' bd / ' + esc(l.baths == null ? '?' : l.baths) + ' ba' +
         (l.sqft ? ' &middot; ' + l.sqft.toLocaleString() + ' sqft' : '') + '</span></div>';
    h += '<div style="color:#333">' + esc(l.title) + '</div>';
    h += '<div style="color:#666">' + esc(l.address) + '</div>';
    h += '<div style="color:#666;text-transform:capitalize">' + esc(l.property_type) + ' &middot; ' +
         (l.cats_ok === true ? '<span style="color:#1e8a3c;font-weight:600">cats OK</span>' : esc(l.pets_note || 'pets: ask (not stated)')) + '</div>';
    if (l.utilities_note) h += '<div style="color:#666">Utilities: ' + esc(l.utilities_note) + '</div>';
    if (l.contact_phone) {
      h += '<div style="color:#333;font-weight:600">&#9742; ' + (l.contact_name ? esc(l.contact_name) + ' &middot; ' : '') +
           '<a href="tel:' + esc(l.contact_phone) + '">' + esc(l.contact_phone) + '</a></div>';
    }
    var isInt = !!interested[l.id];
    h += '<div style="margin-top:6px;display:flex;gap:5px">' +
         '<a href="' + esc(l.url) + '" target="_blank" rel="noopener" style="flex:1;text-align:center;background:#1e8a3c;color:#fff;padding:5px 0;border-radius:4px;text-decoration:none;font-weight:600">View</a>' +
         '<button onclick="_toggleInterest(\'' + esc(l.id) + '\')" style="flex:1.2;background:' + (isInt ? '#d4af37' : '#fff') + ';border:1px solid #b8962e;color:' + (isInt ? '#fff' : '#8a6d1a') + ';border-radius:4px;cursor:pointer;font-weight:600">&#9829; ' + (isInt ? 'On list' : 'Interested') + '</button>' +
         '<button onclick="_hideListing(\'' + esc(l.id) + '\')" style="flex:1;background:#fff;border:1px solid #c33;color:#c33;border-radius:4px;cursor:pointer;font-weight:600">&#10008; Pass</button>' +
         '</div>';
    h += '<div style="color:#999;font-size:10.5px;margin-top:3px">source: ' + esc(l.source) + ' &middot; ' + esc(l.listed_date_or_age || '') + '</div></div>';
    return h;
  }

  function rebuildListings() {
    if (!listingCluster) return;
    listingCluster.clearLayers();
    var shown = 0;
    listingsData.forEach(function (l) {
      if (!l.lat || !l.lng || !listingShown(l)) return;
      shown++;
      var isInt = !!interested[l.id];
      var m = L.circleMarker([l.lat, l.lng], {
        radius: isInt ? 8 : 6, color: isInt ? '#d4af37' : '#fff', weight: isInt ? 3 : 1.5,
        fillColor: TYPE_COLOR[l.property_type] || '#555', fillOpacity: 0.95
      });
      m.bindPopup(listingPopup(l), { maxWidth: 300 });
      listingCluster.addLayer(m);
    });
    var cEl = document.getElementById('lst-count');
    if (cEl) {
      var hid = Object.keys(hiddenIds).length;
      var scope = selectedHood
        ? '<b>' + selectedHood.name + '</b> only <a href="#" onclick="_clearHoodFilter();return false">(back to all his zones)</a> &middot; '
        : (zonesOnly ? 'his green/blue zones &middot; ' : 'entire metro &middot; ');
      cEl.innerHTML = scope + shown.toLocaleString() + ' shown (&le; $' + maxRent.toLocaleString() + ')' +
        (hid ? ' &middot; ' + hid + ' passed <a href="#" onclick="_resetHidden();return false">reset</a> ' +
               '<a href="#" onclick="_copyHidden();return false">copy</a>' : '');
    }
    renderInterestPanel();
  }

  window._showHoodListings = function (i) {
    selectedHood = hoods[i];
    map.closePopup();
    var c = circles.filter(function (e) { return e.hood === selectedHood; })[0];
    if (c) map.fitBounds(c.circle.getBounds().pad(0.3));
    rebuildListings();
  };
  window._clearHoodFilter = function () {
    selectedHood = null;
    rebuildListings();
  };

  // Count of this hood's listings that pass the non-zone filters (for the neighborhood popup)
  function hoodListingCount(h) {
    var n = 0;
    listingsData.forEach(function (l) {
      if (l._hood !== h || hiddenIds[l.id]) return;
      if (typeOn[l.property_type] === false) return;
      var bd = (l.beds == null ? 1 : l.beds), ba = l.baths;
      if (bd < minBeds || bd > maxBeds) return;
      if (ba != null && (ba < minBaths || ba > maxBaths)) return;
      if (ba == null && minBaths > 0) return;
      if (l.price && l.price > maxRent) return;
      n++;
    });
    return n;
  }

  fetch('listings.json').then(function (r) { return r.json(); }).then(function (d) {
    listingsData = d;
    listingsData.forEach(function (l) { l._hood = (l.lat && l.lng) ? assignHood(l) : null; });
    listingCluster = (L.markerClusterGroup ? L.markerClusterGroup({ maxClusterRadius: 46, disableClusteringAtZoom: 15 }) : L.layerGroup());
    map.addLayer(listingCluster);

    // Re-filter listings whenever the neighborhood scoring changes (toggles/sliders/preset)
    var _origUpdateUI = updateUI;
    updateUI = function () { _origUpdateUI(); rebuildListings(); };

    var lc = L.control({ position: 'bottomleft' });
    lc.onAdd = function () {
      var d2 = L.DomUtil.create('div', 'legend');
      d2.style.maxWidth = '230px';
      d2.innerHTML = '<h4 style="margin:0 0 4px">Current rental listings</h4>' +
        '<label style="display:block"><input type="checkbox" id="lst-on" checked> Show listings</label>' +
        '<label style="display:block"><input type="checkbox" id="lst-zones" checked> Only his green/blue zones</label>' +
        '<label style="display:block"><input type="checkbox" id="lst-cats"> Cats confirmed only</label>' +
        '<label style="margin-right:6px"><input type="checkbox" id="lst-apartment" checked> <span style="color:' + TYPE_COLOR.apartment + '">&#9679;</span> Apt</label>' +
        '<label style="margin-right:6px"><input type="checkbox" id="lst-house" checked> <span style="color:' + TYPE_COLOR.house + '">&#9679;</span> House</label>' +
        '<label><input type="checkbox" id="lst-condo" checked> <span style="color:' + TYPE_COLOR.condo + '">&#9679;</span> Condo</label>' +
        '<div style="margin-top:4px;font-size:11.5px">Beds ' +
        '<select id="lst-bdmin"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>' +
        ' to <select id="lst-bdmax"><option value="1">1</option><option value="2">2</option><option value="99" selected>3+</option></select>' +
        ' &nbsp;Baths <select id="lst-bamin"><option value="0" selected>any</option><option value="1">1</option><option value="1.5">1.5</option><option value="2">2</option></select>' +
        ' to <select id="lst-bamax"><option value="1">1</option><option value="1.5">1.5</option><option value="2">2</option><option value="99" selected>any</option></select></div>' +
        '<div id="lst-count" style="font-size:11px;color:#555;margin-top:3px"></div>' +
        '<div style="font-size:10.5px;color:#888">Cat-friendly, $700&ndash;2,400. Follows the Max-rent slider. Click a pin &rarr; View or &#10008; Pass (with a why).</div>';
      L.DomEvent.disableClickPropagation(d2);
      return d2;
    };
    lc.addTo(map);

    var ic = L.control({ position: 'bottomleft' });
    ic.onAdd = function () {
      var d3 = L.DomUtil.create('div', 'legend');
      d3.style.maxWidth = '250px';
      d3.innerHTML = '<h4 id="int-head" style="margin:0;cursor:pointer">&#9829; Interest list (0)</h4>' +
        '<div id="int-body" style="max-height:220px;overflow-y:auto"></div>';
      L.DomEvent.disableClickPropagation(d3);
      d3.querySelector('#int-head').addEventListener('click', function () {
        var b = d3.querySelector('#int-body');
        b.style.display = (b.style.display === 'none' ? '' : 'none');
      });
      return d3;
    };
    ic.addTo(map);

    document.getElementById('lst-on').addEventListener('change', function (ev) { listingsVisible = ev.target.checked; rebuildListings(); });
    document.getElementById('lst-zones').addEventListener('change', function (ev) { zonesOnly = ev.target.checked; selectedHood = null; rebuildListings(); });
    document.getElementById('lst-cats').addEventListener('change', function (ev) { catsOnly = ev.target.checked; rebuildListings(); });
    ['apartment', 'house', 'condo'].forEach(function (t) {
      document.getElementById('lst-' + t).addEventListener('change', function (ev) { typeOn[t] = ev.target.checked; rebuildListings(); });
    });
    document.getElementById('rentslider').addEventListener('input', rebuildListings);
    document.getElementById('lst-bdmin').addEventListener('change', function (ev) { minBeds = parseFloat(ev.target.value); rebuildListings(); });
    document.getElementById('lst-bdmax').addEventListener('change', function (ev) { maxBeds = parseFloat(ev.target.value); rebuildListings(); });
    document.getElementById('lst-bamin').addEventListener('change', function (ev) { minBaths = parseFloat(ev.target.value); rebuildListings(); });
    document.getElementById('lst-bamax').addEventListener('change', function (ev) { maxBaths = parseFloat(ev.target.value); rebuildListings(); });
    rebuildListings();
  }).catch(function (e) {
    console.log('listings.json not available (local file view?): ' + e);
  });
</script>
</body>
</html>
